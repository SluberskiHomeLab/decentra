# LiveKit SFU configuration for Decentra
# See https://docs.livekit.io/realtime/self-hosting/deployment/ for full reference.
#
# SECURITY: Change the key/secret below before any internet-facing deployment.
# The matching values must be set in your .env file / environment:
#   LIVEKIT_API_KEY=devkey
#   LIVEKIT_API_SECRET=devsecret_change_me_in_production

port: 7880

rtc:
  tcp_port: 7881
  udp_port: 7882
  # SECURITY: Set use_external_ip: true when the host is behind NAT (production VPS).
  # Without this, WebRTC connectivity silently fails behind NAT.
  use_external_ip: true

# Built-in TURN relay — replaces a separate Coturn container.
#
# Reverse proxy compatibility guide:
#   - Port 7880 (signaling WebSocket): proxy through nginx/Caddy/Traefik normally.
#   - Port 3478 TCP (TURN): must be directly reachable, NOT through an HTTP proxy.
#     Most nginx/Caddy setups leave this port alone — just open it in your firewall.
#   - Port 5349 TCP (TURN-over-TLS): same as above; required for strict corporate
#     firewalls that block 3478. Needs cert_file + key_file configured below.
#   - For Cloudflare-proxied domains: use LiveKit Cloud (livekit.cloud) — Cloudflare
#     Tunnel does not support WebRTC media traffic.
#
# PRODUCTION: change domain to your server's public hostname or IP address.
turn:
  enabled: true
  domain: localhost
  udp_port: 3478
  tls_port: 5349
  # For TURN-over-TLS (turns:// URI — needed when port 3478 UDP is blocked):
  # cert_file: /etc/livekit/tls.crt
  # key_file:  /etc/livekit/tls.key
  # Mount the cert into the container via docker-compose.yml volumes.

# API key / secret: must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET env vars on the server.
# Format:  <key>: <secret>
keys:
  devkey: devsecret_change_me_in_production

logging:
  level: info
  # Reduce pion (WebRTC) log noise in dev; set to "info" for debugging ICE issues
  pion_level: error
