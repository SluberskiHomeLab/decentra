services:
  postgres:
    image: postgres:16-alpine
    container_name: decentra-postgres
    # NOTE: Remove this port mapping in production to prevent external DB access.
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - decentra-data:/var/lib/postgresql/data
    networks:
      - decentra-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decentra"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: decentra-server
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DECENTRA_ENCRYPTION_KEY=${DECENTRA_ENCRYPTION_KEY}
      - DECENTRA_LICENSE_KEY=${DECENTRA_LICENSE_KEY:-}
    networks:
      - decentra-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: decentra-frontend
    ports:
      - "8765:8443"
    networks:
      - decentra-network
    restart: unless-stopped
    depends_on:
      - server

volumes:
  decentra-data:
    driver: local

networks:
  decentra-network:
    driver: bridge
